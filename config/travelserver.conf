[storage]
# Filesystem labels used to find the two mirror SSDs.
ssd_label_1 = TRAVEL1
ssd_label_2 = TRAVEL2
# Backup root folder created on each SSD.
backup_dir = BACKUP
# Mount root for hot-plugged devices.
mount_root = /mnt/travelserver

[media]
# File extensions to back up.
extensions = jpg jpeg jpe heic heif avif png gif tif tiff raw cr2 cr3 nef arw dng rw2 orf raf mp4 mov m4v avi mpg mts m2ts hevc webm

[led]
# LED wired to the ROCK 5A GPIO header. chip/line refer to libgpiod
# (see README for pin mapping). Set enabled = false to run headless
# without an LED.
enabled = true
gpio_chip = gpiochip0
gpio_line = 32

[iphone]
# Base mount for ifuse.
mountpoint = /mnt/travelserver/iphone

[webui]
# Built-in status dashboard served by the daemon (plain HTTP, LAN only).
enabled = true
bind = 0.0.0.0
port = 8000

[behavior]
# seconds between device polls
poll_interval = 2
# size in bytes above which a hot-plugged disk is never considered
# an SD card reader device (safety guard for formatting)
max_sd_card_bytes = 1099511627776
