# Immich alongside TravelServer — reads the mirrored BACKUP/ folders as
# read-only external libraries. Example file: always start from the compose
# pinned to your Immich release (https://github.com/immich-app/immich/releases)
# and just carry over the two read-only volumes below.
name: immich

services:
  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    ports:
      - "2283:2283"
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    environment:
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-immich}
      DB_HOSTNAME: database
      REDIS_HOSTNAME: redis
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      # TravelServer mirrors, READ-ONLY. Point these at the mountpoints where
      # TRAVEL1/TRAVEL2 are mounted (see lsblk; daemon mounts under
      # /mnt/travelserver/<device>). Immich exposes them for the External
      # Library feature.
      - ${TRAVEL1_BACKUP}:/usr/src/app/external/TRAVEL1:ro
      - ${TRAVEL2_BACKUP}:/usr/src/app/external/TRAVEL2:ro
    restart: always

  immich-machine-learning:
    container_name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    restart: always

  redis:
    container_name: immich-redis
    image: docker.io/valkey/valkey:8-bookworm
    healthcheck:
      test: "valkey-cli ping || exit 1"
    restart: always

  database:
    container_name: immich-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.3.0-pgvectors
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      DB_STORAGE_TYPE: 'HNSW'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    restart: always

volumes:
  model-cache:
